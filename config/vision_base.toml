[detector]
backend_type = "NeuralNetwork"  # Options: "NeuralNetwork", "traditional"
detect_color = "Blue"

# Required if backend_type = "traditional"
[traditional]
advanced_binary = true
dark_percentage = 0.9
binary_threshold = 85
light_min_ratio = 0.0001
light_max_ratio = 1.0
light_max_angle = 40.0
light_color_diff_thresh = 30
armor_min_light_ratio = 0.8
armor_min_small_center_distance = 0.8
armor_max_small_center_distance = 3.5
armor_min_large_center_distance = 3.5
armor_max_large_center_distance = 8.0
armor_max_angle = 40.0

# Classifier configuration (ONNX-based number classification)
classifier_model_path = "mlp.onnx"
classifier_confidence_threshold = 0.5
classifier_enable_type_filtering = true
classifier_use_softmax = true

# Required if backend_type = "nn"
[nn]
model_path = "best.onnx"
device = "AUTO"
device_priorities = "GPU,CPU"
enable_profiling = false
enable_multi_thread = false
confidence_threshold = 0.75
nms_threshold = 0.30
top_k = 128

[nn_tup]
model_path = "opt-1208-001.onnx"
device = "AUTO"
device_priorities = "GPU,CPU"
enable_profiling = false
enable_multi_thread = false
confidence_threshold = 0.75
nms_threshold = 0.30
top_k = 128

[tracker]
inekf_enabled = true

[tracker.jpda_matcher]
enable_jpda_matcher = true   # 启用JpdaMatcher
phase_ambiguous_threshold = 0.3  # 相位模糊阈值
phase_switch_lambda = 0.2         # Viterbi切换惩罚
enable_semantic = true           # 语义融合
enable_viterbi = true             # Viterbi平滑

[tracker.robot]
matcher_gate = 5.0
lost_threshold = 2.0
tracking_threshold = 3

[tracker.robot.model]
sigma_a_xy = 10.0
sigma_a_z = 1.0
sigma_a_yaw = 20.0
sigma_r0 = 1.0
sigma_r1 = 1.0
sigma_h = 0.5

[tracker.robot_inekf]
sigma_a_xy = 40.0
sigma_a_z = 1.0
sigma_w = 0.75
sigma_m = 0.75
sigma_yaw = 26.0
radius0 = 0.23
radius1 = 0.23
height = 0.1
sigma_r = 1.0
sigma_h = 0.05
use_dynamic_noise = false
dynamic_noise_k_radial = 52.5
dynamic_noise_k_tangent = 90.0
# Spherical coordinate observation mode (faster tracking response)
use_spherical_observation = true
sigma_yaw_obs = 0.063
sigma_pitch_obs = 0.063
sigma_armor_yaw = 0.3
# Innovation gating (outlier rejection)
max_angle_innovation = 1.5  # rad (~86°), set larger to allow fast maneuvers
max_dist_innovation = 5.0   # meters

[tracker.outpost]
matcher_gate = 4.0
lost_threshold = 2.0
tracking_threshold = 4

[tracker.outpost.model]
sigma_q_xy = 10.0
sigma_q_z = 2.0
sigma_a_yaw = 8.0

[tracker.outpost_inekf]
sigma_a_xy = 15.0
sigma_a_z = 2.0
sigma_yaw = 20.0
sigma_h = 2.5
sigma_m = 2.5
sigma_w = 2.5
use_dynamic_noise = false
dynamic_noise_k_radial = 0.8
dynamic_noise_k_tangent = 0.0000625
# Spherical coordinate observation mode (faster tracking response)
use_spherical_observation = true
sigma_yaw_obs = 0.063
sigma_pitch_obs = 0.063
sigma_armor_yaw = 0.3
# Innovation gating (outlier rejection)
max_angle_innovation = 0.8  # rad (~86°), set larger to allow fast maneuvers
max_dist_innovation = 3.0   # meters

# MPC-based gimbal trajectory planner (TinyMPC ADMM solver)
[mpc_planner]
# MPC cost weights (yaw)
q_yaw_position = 9.0e6
q_yaw_velocity = 0.0
r_yaw = 1.0
max_yaw_acc = 50.0

# MPC cost weights (pitch)
q_pitch_position = 9.0e6
q_pitch_velocity = 0.0
r_pitch = 1.0
max_pitch_acc = 100.0

# Fire decision parameters
fire_thresh = 0.0005
shooting_range_h = 0.07
shooting_range_w = 0.075
fire_lookahead = 4        # Steps ahead to check for fire decision

# Solver parameters
max_iterations = 10
abs_tol = 1.0e-3
rho = 5.0                 # ADMM penalty parameter

ponder_dt = 0.004                 # 250Hz control rate (matching sp_vision_25)
ponder_back = 20
ponder_ahead = 40

pitch_min = -0.69813169 # -40deg
pitch_max = 0.69813169 # 40deg

# Trajectory compensation
compensator_type = "RK4"

# Adaptive delay compensation (matching sp_vision_25)
decision_speed = 8.0       # rad/s, threshold for high/low speed classification
high_speed_delay = 0.015   # seconds, delay for fast-spinning targets
low_speed_delay = 0.015    # seconds, delay for slow targets

[mpc_planner.trajectory]
iteration_times = 10
bullet_speed = 25.0
gravity = 9.7997
resistance = 0.0005
cd = 0.47
rho = 1.225
diameter = 0.017
mass = 0.0032
rk4_dt = 0.025
rk4_min_steps = 500
rk4_max_steps = 2000

backend_type = "Traditional"  # Options: "Traditional", "OpenVINO", "OpenVINOTup", "TensorRT", "Axera"
default_detect_color = "Blue"

# Required if backend_type = "traditional"
[traditional]
advanced_binary = false
dark_percentage = 0.5
binary_threshold = 85
light_min_ratio = 0.0001
light_max_ratio = 1.0
light_max_angle = 40.0
light_color_diff_thresh = 30
armor_min_light_ratio = 0.8
armor_min_small_center_distance = 0.8
armor_max_small_center_distance = 3.5
armor_min_large_center_distance = 3.5
armor_max_large_center_distance = 8.0
armor_max_angle = 40.0

# Classifier configuration (ONNX-based number classification)
classifier_model_path = "models/mlp.onnx"
classifier_confidence_threshold = 0.5
classifier_enable_type_filtering = true
classifier_use_softmax = true

# Required if backend_type = "nn"
[openvino]
model_path = "models/best.onnx"
device = "CPU"
device_priorities = ""
enable_profiling = false
enable_multi_thread = false
confidence_threshold = 0.75
nms_threshold = 0.30
top_k = 128

[openvino_tup]
model_path = "models/opt-1208-001.onnx"
device = "CPU"
device_priorities = ""
enable_profiling = false
enable_multi_thread = false
confidence_threshold = 0.75
nms_threshold = 0.30
top_k = 128

# Required if backend_type = "TensorRT"
[tensor_rt]
model_path = "models/best_fp16.onnx"  # Path to ONNX model (will be compiled to TensorRT engine)
engine_path = "models/best_fp16_sm87_fp16.engine"  # Optional: Path to pre-built TensorRT engine (.engine file)
engine_cache_dir = "/tmp/tensorrt_cache"  # Directory for caching compiled engines
device_id = 0  # CUDA device ID
num_streams = 2  # Number of CUDA streams for concurrent inference
compute_capability = "87"  # GPU compute capability (e.g., "87" for Jetson Orin, "86" for RTX 3090)
enable_fp16 = true  # Enable FP16 precision (faster, slightly less accurate)
enable_dla = true  # Enable DLA accelerator (if available)
dla_core = 0  # DLA core to use (if enable_dla = true)
confidence_threshold = 0.20
nms_threshold = 0.30
top_k = 128

# Required if backend_type = "Axera" (AX650 NPU)
[axera]
model_path = "models/compiled.axmodel"  # Path to AX650 .axmodel file
input_width = 768
input_height = 576
num_colors = 4
num_kpts = 4
num_pairs = 12
strides = [8, 16, 32]
confidence_threshold = 0.15
nms_threshold = 0.70
top_k = 128

[readback_roi]
enabled = true
stale_timeout_s = 0.20
margin_ratio_x = 0.20
margin_ratio_y = 0.00
box_size_m = [0.6, 0.6, 0.6]

[ldm]
enabled = false
target_color = "Red"
min_blob_area_px = 4
min_blob_fill_ratio = 0.35
min_blob_aspect_ratio = 0.35
max_blob_aspect_ratio = 4.0
min_pair_center_dy_ratio = 1.0
max_pair_center_dy_ratio = 12.0
max_pair_size_delta_ratio = 0.75
max_gap_cv = 0.65
min_preliminary_candidate_score = 0.80
min_preliminary_candidate_score_two_pair = 0.87
min_two_pair_mean_center_dy_px = 12.0
min_pairs_for_detection = 2
max_pairs_per_candidate = 4
rmse_stable_threshold_px = 2.5
rmse_constrained_threshold_px = 5.0

[ldm.geometry]
octagon_side_length_m = 0.020711
octagon_circumradius_m = 0.02706
pair_center_separation_m = 0.036514
window_length_m = 0.012
window_width_m = 0.009618
volume_height_m = 0.067
detectable_center_z_range_m = [-0.01, 0.01]

[tracker]
[tracker.robot]
matcher_gate = 10.0             # Aligned with at_vision rm_bringup config
lost_threshold = 1.0            # Aligned with at_vision rm_bringup config
tracking_threshold = 5          # Aligned with at_vision rm_bringup config

[tracker.robot.model]
sigma_a_xy = 10.0               # Aligned with at_vision
sigma_a_z = 0.1                 # Aligned with at_vision (was 1.0)
sigma_a_yaw = 20.0              # Aligned with at_vision
sigma_r0 = 1.0
sigma_r1 = 1.0
sigma_h = 0.8                   # Aligned with at_vision (was 0.5)
meas_yaw_var_floor = 4e-3
meas_pitch_var_floor = 4e-3
meas_dist_var_floor = 0.3
meas_dist_delta_angle_k = 1.0
meas_armor_yaw_var_floor = 9e-2
meas_armor_yaw_range_k = 0.005

[tracker.robot_inekf]
radius0 = 0.23
radius1 = 0.23
height = 0.05

[tracker.outpost]
matcher_gate = 4.0
lost_threshold = 2.0
tracking_threshold = 4

[tracker.outpost.model]
sigma_q_xy = 10.0
sigma_q_z = 2.0
sigma_a_yaw = 4.0
meas_dist_k = 0.43
yaw_log_k = 0.005

# ============================================================================
# L4 Planning Configuration (Aimer + Planner Architecture)
# ============================================================================

# Fire decision configuration shared by L4 aimers and the L5 MPC fire gate.
[fire_decision]
# Minimum shooting threshold (radians), used for long distances
# Shared fire gate threshold for L4/L5
fire_thresh = 0.01744444
# Legacy delay-gate debug threshold (radians)
delay_gate_error_rad = 3.1744444
# Physical window dimensions (meters)
shooting_range_h = 0.135
shooting_range_w_small = 0.135
shooting_range_w_large = 0.24
min_enable_pitch_deg = 0.25

# Aimer configuration (shared by all target types: Robot/Outpost/Rune)
[aimer]
# System delay compensation (seconds)
# Includes: camera exposure, image processing, communication, gimbal response
delay = 0.04

# Authoritative four-state auto-aim FSM thresholds
single_whole_up = 1.5
single_whole_down = 1.0
whole_pair_up = 8.5
whole_pair_down = 9.5
pair_center_up = 9.0
pair_center_down = 6.0
transfer_thresh = 20
# Armor selection windows
front_window_deg = 60.0
# Legacy knobs retained for config stability; authoritative selection ignores them.
coming_angle_deg = 55.0
leaving_angle_deg = 20.0

# Hard-aligned fire gate uses only min_enable_yaw_deg; yaw_limit_deg is kept for config stability.
yaw_limit_deg = 60.0
min_enable_yaw_deg = 0.25

[aimer.target_selection]
temp_lost_state_score = 0.05
optical_stale_timeout_s = 0.25
switch_margin = 0.08

[aimer.target_selection.weights]
image_center = 1.0
track_state = 3.0
tof = 1.5
distance = 1.0
gimbal_effort = 1.0
armor_name = 6.5

[aimer.target_selection.refs]
image_center_ref_px = 300.0
tof_ref_s = 0.35
distance_ref_m = 10.0
yaw_effort_ref_deg = 20.0
pitch_effort_ref_deg = 10.0

[aimer.target_selection.armor_name_score]
sentry = 0.5
one = 1.0
two = 0.5
three = 0.5
four = 0.5
five = 0.5
outpost = 0.5
base = 0.5
base_large = 0.5
invalid = 0.0

[reference_trajectory]
horizon_ahead = 50
horizon_back = 50
dt = 0.01

[trajectory]
type = "LinearDrag"

iteration_times = 10

gravity = 9.7997
resistance = 0.0005

diameter = 0.017
mass = 0.00312

rho = 1.225

# ============================================================================
# L5 Weapon MPC Controller Configuration
# ============================================================================
# L5-only MPC settings live under [mpc_weapon].

[mpc_weapon]
enabled = true
enable_debug = true
reference_age_threshold_s = 0.5

# Pitch limits (radians)
pitch_min = -0.69813169 # -40deg
pitch_max = 0.69813169 # 40deg

# MPC core parameters
[mpc_weapon.mpc]
max_iterations = 30
abs_tol = 0.1
rho = 1.0

# MPC yaw axis configuration
[mpc_weapon.mpc.yaw]
q_pos = 9e6
q_vel = 0.0
r = 1.0
max_acc = 50.0

# MPC pitch axis configuration
[mpc_weapon.mpc.pitch]
q_pos = 9e6
q_vel = 0.0
r = 1.0
max_acc = 100.0

[rune_detector]
enabled = false
detect_color = "Red"
arrow_threshold = 170
target_threshold = 130
rcenter_threshold = 120

[energy_meter]
# Rune type: true for big rune (sinusoidal model), false for small rune (constant speed)
is_big_rune = true
# Prediction delay (seconds): image latency + system delay
control_delay_s = 0.5

# Angle fitter configuration (Ceres+RANSAC model fitting, migrated from rm_power_rune)
[energy_meter.fitter]
# Minimum observations before fitting
min_fit_data_size = 20
# Maximum stored observations (excess trimmed)
max_fit_data_size = 1200
# Initial big-rune parameters [a, omega, t0, b, c]
# Model: θ(t) = -a·cos(ω·(t+t0)) + b·t + c
initial_params = [0.470, 1.942, 0.0, 1.178, 0.0]
# Small rune rotation speed (rad/s, ~60°/s)
small_rune_rotation_speed = 1.04719
# Direction voting frames needed
direction_threshold = 3
# Direction angle-difference threshold (rad)
direction_angle_threshold = 0.015

# ISRCKF tracker configuration for energy meter
[energy_meter.tracker]
# Lost frames before returning to IDLE from TEMP_LOST (seconds)
lost_thres = 10
# Consecutive frames required to transition DETECTING -> TRACKING
tracking_thres = 3
# Mahalanobis distance-squared gate for observation-to-track association
matcher_gate = 25.0

# Process noise covariance for ISRCKF tracker
[energy_meter.tracker.energy_params]
# XY position process noise std-dev (m)
sigma_xy = 10.0
# Z position process noise std-dev (m)
sigma_z = 1.0
# Roll angle process noise std-dev (rad)
sigma_roll = 1.0
# Initial radius guess (m)
radius = 0.7
# Measurement distance scaling factor
meas_dist_k = 0.43

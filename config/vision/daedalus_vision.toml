# Infantry Vision Configuration
# extend from vision_base.toml

# L4 trajectory compensation overrides
trajectory.type = "Ideal"

trajectory.diameter = 0.017
trajectory.mass = 0.00312
trajectory.gravity = 9.81

[traditional]
advanced_binary = false
dark_percentage = 0.4
binary_threshold = 75
light_min_ratio = 0.0001
light_max_ratio = 1.0
light_max_angle = 40.0
light_color_diff_thresh = 10
armor_min_light_ratio = 0.8
armor_min_small_center_distance = 0.8
armor_max_small_center_distance = 3.5
armor_min_large_center_distance = 3.5
armor_max_large_center_distance = 8.0
armor_max_angle = 40.0

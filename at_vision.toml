daedalus = true

robot = "infantry_4"  # any of: 'infantry', 'hero', 'sentry'
vision = "daedalus_vision"


# Hostname-based preset auto-matching.
# The system hostname is looked up in [preset]; the matched entry provides
# robot, vision, and optionally daedalus. If no match is found, falls back
# to the explicit robot/vision/daedalus fields above.
[preset]
"ax650.local"      = { daedalus = false, robot = "drone",       vision = "drone_vision" }
"blackjack.local"  = { daedalus = true,  robot = "infantry_4",  vision = "daedalus_vision" }
"hero.local"       = { daedalus = false,  robot = "hero",        vision = "hero_vision" }

[foxglove]
enabled = true
transport = "WebSocket"
host = "0.0.0.0"
port = 8765
mcap_path = "record/foxglove.mcap"

[foxglove.quanta]
target_bitrate = 100500
max_width = 480
max_height = 360
gop_size = 1
framerate = 30
preset = "fast"
tune = "ssim"

[capturer]
enabled = false
output_dir = "record"
reserved_free_bytes = 2097152

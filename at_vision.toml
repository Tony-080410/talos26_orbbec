robot = 'sentry'
imu_vendor_id = 0x483
untrust_roll = true
[foxglove]
enabled = true
host = "0.0.0.0"
port = 8765

[at_legacy.detector]
backend_type = "Traditional"
detect_color = "Blue"

# Required if backend_type = "traditional"
[at_legacy.traditional]
advanced_binary = true
dark_percentage = 0.5
binary_threshold = 85
light_min_ratio = 0.0001
light_max_ratio = 1.0
light_max_angle = 40.0
light_color_diff_thresh = 30
armor_min_light_ratio = 0.8
armor_min_small_center_distance = 0.8
armor_max_small_center_distance = 3.5
armor_min_large_center_distance = 3.5
armor_max_large_center_distance = 8.0
armor_max_angle = 40.0

# Classifier configuration (ONNX-based number classification)
classifier_model_path = "mlp.onnx"
classifier_confidence_threshold = 0.5
classifier_enable_type_filtering = true
classifier_use_softmax = true

# Required if backend_type = "nn"
[at_legacy.nn]
model_path = "at.onnx"
device = "AUTO"
device_priorities = "GPU,CPU"
enable_profiling = false
enable_multi_thread = false
confidence_threshold = 0.75
nms_threshold = 0.30
top_k = 128

[at_legacy.nn_tup]
model_path = "opt-1208-001.onnx"
device = "AUTO"
device_priorities = "GPU,CPU"
enable_profiling = false
enable_multi_thread = false
confidence_threshold = 0.75
nms_threshold = 0.30
top_k = 128

[tracker]
# ============================================================================
# L3 Estimation: Armor Tracker (association + state machine + filters)
# ============================================================================
#
# Problem:
#   Convert per-frame armor detections (misses, clutter, multiple plates) into a stable target state
#   output that can be predicted forward.
#
# Intuition:
#   Tracker = Association + State machine + Filter(s).
#   - Association decides found/not-found and assigns armor_id.
#   - State machine debounces (confirm before TRACKING, tolerate brief loss).
#   - Filters estimate motion/geometry and provide prediction.
#
# Analogy:
#   Like tracking a person in a crowd: first pick the right person, then keep tracking through brief
#   occlusions using your motion prediction.
#
# Precise (implementation facts that are easy to misread):
#   - Association ALWAYS uses ISRCKF predictions (x_pred, Sx_pred) and the heuristic measurement
#     noise R from `motion_model.hpp::{RobotModel,OutpostModel}::R_diag`.
#   - Even when InEKF is enabled and preferred as output, InEKF updates still rely on the armor_id
#     produced by this ISRCKF-based association. So: tune ISRCKF association first, InEKF later.
#   - TOML parsing is strict in this codebase: keys read with READ(...) are required (missing keys
#     cause a runtime "Missing key/table" error).
#
# Recommended tuning order:
#   1) Association + state machine: matcher_gate, tracking_threshold, lost_threshold
#   2) ISRCKF process noise: tracker.*.model.sigma_*
#   3) InEKF noise/geometry: tracker.*_inekf.*
#
# Quick symptoms (heuristics, not proofs):
#   - Flicker / never enters Tracking: gate too small, tracking_threshold too large, or model noise too small
#   - Drops under brief occlusion: lost_threshold too small (or gate too small)
#   - Jumps to wrong armor/clutter: gate too large or model noise too large (loose covariance => loose gate)
#   - Lags on fast motion/spin: increase sigma_a_xy / sigma_a_yaw (or InEKF sigma_a_xy / sigma_yaw)
#   - Jittery state/yaw/geometry: decrease model noise; or increase InEKF sigma_m/sigma_w; or decrease sigma_r/sigma_h
#
# inekf_enabled
# Problem: optionally run a group-consistent estimator (SE2(3)) in parallel.
# Intuition: true runs InEKF and prefers its output; false uses ISRCKF only.
# Analogy: enable a "second opinion" estimator.
# Precise: association remains ISRCKF-based regardless of this flag; this flag gates only InEKF predict/update/output.
inekf_enabled = true

[tracker.robot]
# Robot (4-armors): association + state-machine thresholds.
#
# matcher_gate (Mahalanobis distance-squared gate d2)
# Problem: reject clutter / wrong armor_id during association.
# Intuition: larger -> fewer missed matches but more wrong matches; smaller -> stricter but more TEMP_LOST/resets.
# Analogy: a chi-square gate width (normalized units, not pixels/meters).
# Precise: accept candidate iff d2 < gate, where d2 = nu^T (Pzz + R)^{-1} nu (R from model.R_diag).
matcher_gate = 5.0
# lost_threshold (s)
# Problem: brief occlusion should not immediately reset the track.
# Intuition: larger -> coast longer on prediction; smaller -> drop and re-acquire sooner.
# Analogy: network timeout / grace period.
# Precise: in TempLost, `lost_time_` accumulates until >= lost_threshold then reset.
lost_threshold = 2.0
# tracking_threshold (frames)
# Problem: avoid locking to a single-frame false positive.
# Intuition: larger -> more conservative but slower lock; smaller -> faster lock but more flicker.
# Analogy: debounce counter.
# Precise: Detecting->Tracking uses strict `>` (hit_count > tracking_threshold), so it requires
#          tracking_threshold+1 hits; any miss during Detecting resets immediately.
tracking_threshold = 3
[tracker.robot.model]
# Robot ISRCKF process noise (std-dev), used in `RobotModel::Q_sqrt(dt)`.
# Note: ISRCKF measurement noise R is a heuristic in `RobotModel::R_diag` and is NOT configurable here.
#
# sigma_a_xy (≈ m/s^2)
# Problem: CV model cannot explain real XY acceleration.
# Intuition: larger -> follow maneuvers (noisier); smaller -> smoother but laggier.
# Analogy: horizontal agility knob.
# Precise: drives the CV blocks for (xc,vx) and (yc,vy) with dt^2..dt^4 scaling.
sigma_a_xy = 10.0
# sigma_a_z (≈ m/s^2)
# Problem/Intuition/Analogy: same as sigma_a_xy, but for z (z0,vz).
# Precise: drives the CV block for (z0,vz).
sigma_a_z = 1.0
# sigma_a_yaw (≈ rad/s^2)
# Problem: constant yaw-rate cannot explain spin-up/spin-down.
# Intuition: larger -> follow fast turns; smaller -> smoother yaw but lag.
# Analogy: turn-rate agility knob.
# Precise: drives the CV block for (yaw,v_yaw).
sigma_a_yaw = 20.0
# sigma_r0 (≈ m/sqrt(s))
# Problem: radius r0 is imperfect and can drift due to geometry/calibration mismatch.
# Intuition: larger -> geometry learns faster but can drift; smaller -> geometry is more stable.
# Analogy: a slowly-wandering calibration parameter.
# Precise: random-walk term Q(R0,R0) += sigma_r0^2 * dt; geometry is also hard-clamped (see tracker.hpp).
sigma_r0 = 1.0
# sigma_r1 (≈ m/sqrt(s))
# Problem/Intuition/Analogy: same as sigma_r0, but for radius r1 (the other armor pair).
# Precise: Q(R1,R1) += sigma_r1^2 * dt; geometry is also hard-clamped.
sigma_r1 = 1.0
# sigma_h (≈ m/sqrt(s))
# Problem: height offset h can drift due to mounting/model mismatch.
# Intuition: larger -> adapts faster but can wander; smaller -> more stable geometry.
# Analogy: a slowly-varying height bias.
# Precise: Q(H,H) += sigma_h^2 * dt; geometry is also hard-clamped:
#   r0,r1 in [0.17,0.27], h in [-0.2,0.2] after each ISRCKF predict.
sigma_h = 0.5

[tracker.robot_inekf]
# Robot InEKF parameters (affect InEKF only; association still uses ISRCKF).
#
# Problem:
#   Provide a group-consistent estimate (SE2(3) with yaw-only rotation) and learn geometry using an
#   InEKF that can be more stable/consistent than a Euclidean-state EKF variant.
#
# Intuition:
#   - Process noise (sigma_a_*, sigma_yaw, sigma_r, sigma_h) = "model wiggle room".
#   - Measurement noise (sigma_m, sigma_w) = "sensor credibility".
#
# Analogy:
#   Like two knobs: how much you trust your prediction vs your measurements.
#
# Precise (naming + implementation pitfalls):
#   - sigma_yaw is yaw *process* noise (angular-acceleration std-dev), NOT measurement noise.
#   - sigma_w is yaw *measurement* noise std-dev (rad); "w" is historical and NOT yaw-rate.
#   - radius0/radius1/height initialize InEKF geometry only.
#   - IMPORTANT: ISRCKF robot geometry init is hard-coded (r0=r1=0.23, h=0.0 in `tracker.hpp`), so
#     changing radius0/radius1/height here will NOT change association behavior.
# sigma_a_xy (≈ m/s^2): XY acceleration process noise.
sigma_a_xy = 10.0
# sigma_a_z (≈ m/s^2): Z acceleration process noise.
sigma_a_z = 1.0
# sigma_w (rad): yaw measurement noise (std-dev).
# Problem: yaw measurements can jump (PnP jitter or wrong armor_id for a frame).
# Intuition: larger -> yaw more stable; smaller -> yaw follows measurements more tightly (jumpy).
# Analogy: trusting a twitchy compass needle.
# Precise: used as R = sigma_w^2 in InEKF update_yaw; yaw_meas is derived from (armor_yaw_meas - yaw_offset),
#          so correct armor_id association is a prerequisite.
sigma_w = 0.25
# sigma_m (m): 3D armor position measurement noise (std-dev).
# Problem: PnP + TF position can be noisy/spiky.
# Intuition: smaller -> more responsive but jittery; larger -> smoother but slower.
# Analogy: a measurement confidence slider.
# Precise: used as Rm = I * sigma_m^2 in update_armor.
sigma_m = 0.5
# sigma_yaw (≈ rad/s^2): yaw angular-acceleration process noise.
sigma_yaw = 20.0
# radius0/radius1/height (m): InEKF geometry initialization (clamped internally).
# Problem: a good initial guess stabilizes early updates.
# Intuition: closer to reality -> faster convergence; wrong -> early residuals/jitter.
# Analogy: initial guess for an optimizer.
# Precise: affects InEKF only (not ISRCKF association).
radius0 = 0.23
radius1 = 0.23
# height (m): h = z(armor 1/3) - z(armor 0/2) in the model; can be negative (pair swapped).
height = 0.0
# sigma_r (≈ m/sqrt(s)): geometry radius random-walk noise (shared for r0/r1).
# Problem/Intuition/Analogy: allow radii to drift; larger adapts faster but can drift.
# Precise: random-walk noise term for r0/r1 in the InEKF covariance propagation.
sigma_r = 0.3
# sigma_h (≈ m/sqrt(s)): geometry height random-walk noise (for h).
# Problem/Intuition/Analogy: allow h to drift; larger adapts faster but can wander.
# Precise: random-walk noise term for h in the InEKF covariance propagation.
sigma_h = 0.01

[tracker.outpost]
# Outpost (3-armors): association/state-machine thresholds (same semantics as robot).
matcher_gate = 5.0
lost_threshold = 1.0
tracking_threshold = 5
[tracker.outpost.model]
# Outpost ISRCKF process noise (std-dev), used in `OutpostModel::Q_sqrt(dt)`.
#
# Problem (naming pitfall):
#   The outpost ISRCKF has no vx/vy states; x/y/z are constant in `f()`. The sigma_q_* terms are
#   implemented with Q ∝ sigma_q^2 * dt^2, so they behave like a drift-velocity scale (m/s), not a
#   classic random-walk scale (m/sqrt(s)).
#
# Intuition:
#   Outposts are usually close to stationary, so sigma_q_* is typically much smaller than robot
#   acceleration noise; too large makes the position/height wander.
#
# Analogy:
#   A random "drift speed" that can push the outpost center over time.
#
# Precise:
#   Equivalent to x_{k+1} = x_k + v_drift * dt with v_drift ~ N(0, sigma_q^2).
# sigma_q_xy (≈ m/s): XY drift-velocity noise scale.
sigma_q_xy = 1.0
# sigma_q_z (≈ m/s): Z drift-velocity noise scale (applied to z0/z1/z2).
sigma_q_z = 1.0
# sigma_a_yaw (≈ rad/s^2): yaw angular-acceleration process noise.
sigma_a_yaw = 5.0
[tracker.outpost_inekf]
# Outpost InEKF parameters.
#
# Problem:
#   Outpost radius is fixed by the model; only relative heights dz1/dz2 are estimated (extra-state).
#
# Intuition:
#   sigma_h controls how quickly dz1/dz2 are allowed to drift. Too large can make the vertical layout
#   wander, especially if measurements are noisy.
#
# Analogy:
#   A learning-rate knob for the outpost's vertical layout.
#
# Precise:
#   - dz process noise is Q(dz) += sigma_h^2 * dt.
#   - There is no range clamp for dz1/dz2 (only NaN/Inf sanitization), so avoid overly large sigma_h.
sigma_a_xy = 10.0
sigma_a_z = 1.0
sigma_yaw = 5.0
sigma_h = 5.0
sigma_m = 5.0
sigma_w = 5.0

[planner]
# ============================================================================
# L4 Planning: GimbalPlanner (lead + armor selection + ballistic compensation)
# ============================================================================
#
# Problem:
#   Convert L3 TrackerOutput into gimbal yaw/pitch commands and a `fire_advice` flag.
#
# Intuition:
#   - Timing first: bullet_speed + plan_to_muzzle_delay determine lead; if timing is wrong, all other
#     parameters look wrong.
#   - Then tune armor selection and mode switching (side_angle/min_switching_v_yaw/max_tracking_v_yaw/transfer_thresh).
#   - Finally tune the ballistics model parameters (resistance or RK4 params).
#
# Analogy:
#   Like throwing a ball: lead by (observation delay + actuation delay + flight time).
#
# Precise (planner.hpp::GimbalPlanner::plan):
#   dt = (current_time_ns - measurement_ts)/1e9 + flying_time + plan_to_muzzle_delay
#   - flying_time is first approximated using LOS-to-center + bullet_speed, then refined by the
#     configured trajectory compensator.
#
# Quick symptoms (heuristics):
#   - Hits behind/ahead: bullet_speed or plan_to_muzzle_delay wrong (lead time wrong)
#   - Fast spin causes yaw jitter / armor bouncing: threshold too high or transfer_thresh too small (enter TrackingCenter earlier)
#   - Slow spin causes frequent boundary switching: min_switching_v_yaw too small or side_angle too large
#   - fire_advice always false/true: shooting_range_w/h inappropriate (also has a minimum 1 deg tolerance)
# shooting_range_w/h (m): fire window size (NOT a distance "range").
# Problem: define a practical "good enough to shoot" window on the target.
# Intuition: larger -> fire more easily; smaller -> stricter.
# Analogy: the size of the bullseye.
# Precise: converted to angular tolerance by atan2(window/2, distance) with a minimum of 1 degree.
shooting_range_w = 0.135
shooting_range_h = 0.135
# max_tracking_v_yaw (rad/s): mode-switch threshold (TrackingArmor <-> TrackingCenter).
# Problem: at high spin, tracking a specific armor jitters; tracking the center is more stable.
# Intuition: larger -> stay in armor-tracking longer; smaller -> switch to center-tracking sooner.
# Analogy: track the wheel hub instead of a spinning spoke.
# Precise: compared against |v_yaw| from the tracker and debounced by transfer_thresh using strict `>`.
# Unit warning: tracker v_yaw is in rad/s. If you think in deg/s, divide by 57.3 (e.g., 60 deg/s ≈ 1.047 rad/s).
max_tracking_v_yaw = 60.0 # rad/s (watch unit!)
# plan_to_muzzle_delay (s): extra latency from "now" to bullet leaving the muzzle (does NOT include flight time).
# Problem: actuation/trigger delays add extra lead time.
# Intuition: larger -> aim further ahead; smaller -> less lead.
# Analogy: your reaction time before throwing.
# Precise: added to dt in the planner time alignment.
plan_to_muzzle_delay = 0.210
# side_angle (deg): directional bias for armor selection under rotation.
# Problem: the best armor now may not be best at bullet-arrival time.
# Intuition: larger -> stronger predictive bias (can switch too early); smaller -> weaker bias (can lag).
# Analogy: step ahead in the direction a carousel is turning.
# Precise: applied with the sign of v_yaw; disabled when |v_yaw| < min_switching_v_yaw.
side_angle = 15.0
# min_switching_v_yaw (rad/s): disable side_angle bias when rotation is slow.
# Problem: avoid jitter near armor boundaries at low yaw-rate.
# Intuition: larger -> bias disabled more often; smaller -> bias enabled more often.
# Analogy: hysteresis deadband.
# Precise: if |v_yaw| < min_switching_v_yaw then theta is forced to 0 in select_best_armor().
min_switching_v_yaw = 1.0 # rad/s
# transfer_thresh (frames): debounce counter for mode switching.
# Problem: avoid mode flips due to a single noisy frame.
# Intuition: larger -> fewer flips but slower response; smaller -> faster response but flicker.
# Analogy: require N consecutive frames before a state change.
# Precise: implemented as `overflow_count_ > transfer_thresh`, so it requires transfer_thresh+1 frames.
transfer_thresh = 5
# compensator_type: selects the ballistic model ("Ideal", "Resistance", "RK4"; case-insensitive).
# Problem: trade accuracy vs compute cost and calibration complexity.
# Intuition: Ideal fastest; Resistance fast with one fitted parameter; RK4 most physical but heavier (uses a lookup table).
# Analogy: straight-line estimate vs fitted curve vs physics simulation.
# Precise: selects the concrete TrajectoryCompensator implementation.
compensator_type = "RK4"

[planner.trajectory]
# Trajectory compensator parameters.
# Problem: compute flight time and drop compensation.
# Intuition: bullet_speed dominates; drag parameters refine long-range behavior.
# Analogy: your ballistics model settings.
# Precise: maps to `TrajectoryConfig` in `include/fcs/L4_planning/gimbal_planner/config.hpp`.
# iteration_times: pitch-solve max iterations (NOT RK4 integration steps).
iteration_times = 20
# bullet_speed (m/s): most sensitive parameter for both lead (TOF) and drop.
bullet_speed = 22.0
# gravity (m/s^2): affects long-range drop.
gravity = 9.7997
# resistance (~1/m): simplified exponential drag coefficient (Resistance model only); clamped to >= 1e-4 in code.
resistance = 0.005
# RK4 quadratic-drag parameters (RK4 model only): k = 0.5*cd*rho*A/m with A = pi*(diameter/2)^2.
cd = 0.47
rho = 1.225
diameter = 0.017
mass = 0.0032
# RK4 integration control:
# - rk4_dt is the *desired* dt; code clamps it to [1e-5, 0.02].
# - actual dt is chosen from flight-time estimate and clamped by rk4_min_steps/rk4_max_steps.
rk4_dt = 0.025
rk4_min_steps = 50
rk4_max_steps = 500

[weapon]
fire_delay = 0.085 # Additional prediction delay compensation (seconds)
min_fire_confidence = 0.7
max_fire_angular_velocity = 10.0

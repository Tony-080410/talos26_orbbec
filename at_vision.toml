daedalus = false
robot = 'sentry'
imu_vendor_id = 0x483
untrust_roll = true
[foxglove]
enabled = true
host = "0.0.0.0"
port = 8765

[at_legacy.detector]
backend_type = "Traditional"
detect_color = "Blue"

# Required if backend_type = "traditional"
[at_legacy.traditional]
advanced_binary = true
dark_percentage = 0.5
binary_threshold = 85
light_min_ratio = 0.0001
light_max_ratio = 1.0
light_max_angle = 40.0
light_color_diff_thresh = 30
armor_min_light_ratio = 0.8
armor_min_small_center_distance = 0.8
armor_max_small_center_distance = 3.5
armor_min_large_center_distance = 3.5
armor_max_large_center_distance = 8.0
armor_max_angle = 40.0

# Classifier configuration (ONNX-based number classification)
classifier_model_path = "mlp.onnx"
classifier_confidence_threshold = 0.5
classifier_enable_type_filtering = true
classifier_use_softmax = true

# Required if backend_type = "nn"
[at_legacy.nn]
model_path = "at.onnx"
device = "AUTO"
device_priorities = "GPU,CPU"
enable_profiling = false
enable_multi_thread = false
confidence_threshold = 0.75
nms_threshold = 0.30
top_k = 128

[at_legacy.nn_tup]
model_path = "opt-1208-001.onnx"
device = "AUTO"
device_priorities = "GPU,CPU"
enable_profiling = false
enable_multi_thread = false
confidence_threshold = 0.75
nms_threshold = 0.30
top_k = 128

# ============================================================================
# L3 Estimation: Armor Solver (Ballistic Compensation)
# ============================================================================

[tracker.robot]
matcher_gate = 5.0
lost_threshold = 2.0
tracking_threshold = 3
[tracker.robot.model]
sigma_a_xy = 10.0
sigma_a_z = 1.0
sigma_a_yaw = 20.0
sigma_r0 = 1.0
sigma_r1 = 1.0
sigma_h = 0.5

[tracker.ineff]
sigma_a_xy = 10.0
sigma_a_z = 1.0
sigma_w = 0.25
sigma_m = 0.5
enable = true
sigma_yaw = 20.0
radius0 = 0.23
radius1 = 0.23
height = 0.0
debug = true
sigma_r = 0.3
sigma_h = 0.01

[tracker.outpost]
matcher_gate = 5.0
lost_threshold = 1.0
tracking_threshold = 5
[tracker.outpost.model]
sigma_q_xy = 1.0
sigma_q_z = 1.0
sigma_a_yaw = 5.0


[planner]
# Shooting range (determines fire_advice trigger zone)
shooting_range_w = 0.135  # Horizontal shooting window (meters)
shooting_range_h = 0.135  # Vertical shooting window (meters)

max_tracking_v_yaw = 60.0 # Max angular velocity for armor tracking (rad/s)
plan_to_muzzle_delay = 0.0985
side_angle = 15.0              # Side angle threshold for armor selection (degrees)
min_switching_v_yaw = 1.0      # Min angular velocity for armor switching (rad/s)
transfer_thresh = 5            # State transfer counter threshold (frames)

# Trajectory compensator type: "Ideal", "Resistance", or "RK4"
compensator_type = "RK4"

[planner.trajectory]
iteration_times = 20       # Number of iterations for ballistic compensation
bullet_speed = 22.0        # Bullet velocity (m/s)
gravity = 9.7997              # Gravity acceleration (m/s^2)
resistance = 0.005         # Air resistance coefficient

# RK4 quadratic-drag parameters (used when compensator_type = "RK4")
cd = 0.47                 # Drag coefficient (dimensionless)
rho = 1.225               # Air density (kg/m^3)
diameter = 0.017          # Bullet diameter (m), area is computed internally
mass = 0.0032             # Bullet mass (kg)
rk4_dt = 0.025            # Desired integration dt (s)
rk4_min_steps = 50        # Min integration steps
rk4_max_steps = 500      # Max integration steps

[weapon]
fire_delay = 0.085 # Additional prediction delay compensation (seconds)
min_fire_confidence = 0.7
max_fire_angular_velocity = 10.0

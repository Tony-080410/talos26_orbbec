# Robots Configuration
# 每台机器人的独立配置文件

[robot_infantry]
name = "Infantry"
type = "Infantry"

[robot_infantry.camera]
# 相机内参配置
camera_matrix = [
    1825.132, 0.000, 725.494, 0.000, 1816.228, 607.733, 0.000, 0.000, 1.000
]
distort_coefficient = [-0.101, 0.451, -0.005, -0.001, -0.920]

width = 1440
height = 1080

[robot_infantry.camera.profile]
# HikCamera配置
trigger_mode = false
invert_image = false
exposure_time_us = 3000  # 3ms in microseconds
gain = 16.7

[robot_hero]
name = "Hero"
type = "Hero"

[robot_hero.camera]
# 相机内参配置
camera_matrix = [631.691, 0, 676.572, 0, 615.369, 557.998, 0, 0, 1]
distort_coefficient = [-0.120895, 0.0494584, -0.0136733, 0.00443922, -0.00887769]
width = 3072
height = 2048

[robot_hero.camera.profile]
# HikCamera配置
trigger_mode = false
invert_image = true
exposure_time_us = 15000  # 3ms in microseconds
gain = 16.7
rotate_angle = "Clockwise270"
